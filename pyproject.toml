[project]
name = "mesomath"
description = "A robust sexagesimal, metrological, and astronomical engine for Babylonian mathematics. From the Eduba to the Jupyter Notebook."
readme = "README.md"
requires-python = ">=3.11"
license = "CC0-1.0"
license-files = ["LICEN[CS]E*"]
authors = [
  { name = "Jesús Cabrera", email = "jccsvq@gmail.com" },
]
keywords = [
  "assyriology",
  "astronomy",
  "babylonian-mathematics",
  "calculator",
  "cuneiform",
  "history-of-science",
  "ipython-shell",
  "mesopotamia",
  "metrology",
  "sexagesimal",
  "sumerian"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: Web Environment",  # Notebooks/Binder
  "Intended Audience :: Education",
  "Intended Audience :: Other Audience",  # Historiadores y aficionados
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Physics",  # Unidades de tiempo y constantes astronómicas
  "Topic :: Sociology :: History",  # Arqueología e historia del mundo antiguo
  "Typing :: Typed",
]
dependencies = [
  "ipython>=9.0.0",
  "parsimonious==0.11.0",
  "traitlets>=5.0.0",
  "typing-extensions>=4.0.0",
  "wcwidth",
  "pymeeus==0.5.12", 
  "juliandate",
]
dynamic = ["version"]

[project.urls]
Changelog = "https://github.com/jccsvq/mesomath/blob/main/CHANGELOG.md"
Documentation = "https://mesomath.readthedocs.io/"
Homepage = "https://github.com/jccsvq/mesomath"
Issues = "https://github.com/jccsvq/mesomath/issues"
Repository = "https://github.com/jccsvq/mesomath.git"

[project.scripts]
babcalc = "mesomath.babcalc:main"
ibabcalc = "mesomath.ibabcalc:start_ibabcalc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# =========================================================================
# HATCH BUILD TARGETS (Monorepo Parallel Packages Package Mapping)
# =========================================================================
[tool.hatch.build.targets.wheel]
packages = [
    "src/mesomath",
    "src/mesotimes"
]

[tool.hatch.build.targets.sdist]
exclude = [
  ".fslckout",
  "/.github",
  ".ipynb_checkpoints",
  "/docs/build",
  "tempo.py",
  "*.db3",
  "caca*.*",
  "*.ipynb",
  "tests/.pytest_cache",
  "/biblio",
  "/other",
  "/data",
  "/db_data/PD71/processed/",
  "/db_data/PD71/sql/",
  "/db_data/PD71/pdchron71.csv",
  "/.continue/",
]

[tool.hatch.version]
path = "src/mesomath/__about__.py"

# =========================================================================
# TESTING & COVERAGE CONFIGURATION (Expanded for mesotimes)
# =========================================================================
[tool.coverage.run]
source_pkgs = ["mesomath", "mesotimes", "tests"]
branch = true
parallel = true
omit = [
  "src/mesomath/__about__.py",
  "src/mesotimes/__about__.py",
]

[tool.coverage.paths]
mesomath = ["src/mesomath", "*/mesomath/src/mesomath"]
mesotimes = ["src/mesotimes", "*/mesomath/src/mesotimes"]
tests = ["tests", "*/mesomath/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

# =========================================================================
# DEVELOPMENT ENVIRONMENT SUITES (Static Typing & Docs)
# =========================================================================
[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]

[tool.hatch.envs.types.scripts]
# Añadimos src/mesotimes al escaneo estático de tipos
check = "mypy --install-types --non-interactive {args:src/mesomath src/mesotimes tests}"

[tool.hatch.envs.docs]
dependencies = [
  "sphinx>=8.0",
  "myst-parser",
  "sphinx-copybutton",
]

[tool.hatch.envs.docs.scripts]
build = "make -C docs html"

[[tool.mypy.overrides]]
module = ["pymeeus.*", "parsimonious.*"]
ignore_missing_imports = true

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"

[[tool.mypy.overrides]]
module = ["untyped_package.*"]
follow_untyped_imports = true
