version: 2

# .readthedocs.yaml
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    post_install:
      - mkdir -p ~/.fonts
      - wget https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansCuneiform/NotoSansCuneiform-Regular.ttf -P ~/.fonts
      # Añadimos la ruta de fuentes a las variables de entorno del sistema
      - export OSFONTDIR=$HOME/.fonts:$OSFONTDIR
      - fc-cache -f -v

sphinx:
  configuration: docs/source/conf_rtd.py

formats:
  - pdf
  - epub

python:
  install:
    - requirements: requirements_rtd.txt
    - method: pip
      path: .