version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  # JOBS debe estar al mismo nivel que TOOLS
  jobs:
    post_install:
      - mkdir -p ~/.fonts
      - wget https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansCuneiform/NotoSansCuneiform-Regular.ttf -P ~/.fonts
      - fc-cache -f -v

sphinx:
  configuration: docs/source/conf.py

formats:
  - epub

python:
  install:
    - requirements: requirements_rtd.txt
    - method: pip
      path: .